apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "kubernetes-cluster-cluster1-crossplane-bb"
  namespace: "argocd"
spec:
  project: "default"
  source:
    repoURL: "https://github.com/tommyliverani/highway-to-cloud.git"
    targetRevision: "develop"
    path: "building_blocks/crossplane"
    directory:
      recurse: true
  # Building blocks are cluster-scoped (XRD, Composition, Provider, Function, ClusterProviderConfig).
  destination:
    server: https://kubernetes.default.svc
    namespace: "crossplane-system"
  # No automated sync: the deploy pipeline of this component syncs it.
