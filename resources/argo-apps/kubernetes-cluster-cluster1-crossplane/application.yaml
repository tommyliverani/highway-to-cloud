apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "kubernetes-cluster-cluster1-crossplane"
  namespace: "argocd"
spec:
  project: "default"
  # The Helm chart of the "crossplane" component (resources/<resource_id>-crossplane): the path must match
  # that component's `resource` in the recipe of service-info.yaml.
  source:
    repoURL: "https://github.com/tommyliverani/highway-to-cloud.git"
    targetRevision: "main"
    path: "resources/kubernetes-cluster-cluster1-crossplane"
  destination:
    server: https://kubernetes.default.svc
    namespace: "crossplane-system"
  # No automated sync: the deploy pipeline of the "crossplane" component syncs it. Server-side apply: the
  # Crossplane CRDs are too large for client-side apply.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
