apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "argo-app"
  namespace: "argocd"
spec:
  project: "default"
  source:
    repoURL: "https://github.com/tommyliverani/highway-to-cloud.git"
    targetRevision: "main"
    path: "resources/argo-apps"
    # Every manifest under the path, except the files the platform process writes in each resource folder
    # (they are not Kubernetes objects to apply).
    directory:
      recurse: true
      exclude: '{**/.idp.yaml,**/catalog-info.yaml,**/variables.json}'
  destination:
    server: https://kubernetes.default.svc
    namespace: "argocd"
  # No automated sync: the deploy pipeline of the components delivered by this Application syncs it.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
