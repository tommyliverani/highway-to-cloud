name: deploy-crossplane

# Deploy module for tool "crossplane". The actual deploy is GitOps: Argo CD syncs the manifests once the
# resource is merged into main. This module only checks that the resource renders (helm template with
# its variables.json), so a broken resource blocks the merge into main.
on:
  workflow_call:
    inputs:
      resource:
        description: 'Resource folder, e.g. resources/storage1'
        required: true
        type: string
      ref:
        description: 'Commit to deploy'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      RESOURCE: ${{ inputs.resource }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # A Crossplane resource is a Helm chart fed with variables.json: render it the way Argo CD will.
      - name: Render manifests
        run: |
          [[ "$RESOURCE" =~ ^resources/[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid resource '$RESOURCE'"; exit 1; }
          helm template "$(basename "$RESOURCE")" "$RESOURCE" --values "$RESOURCE/variables.json" > "$RUNNER_TEMP/manifests.yaml" || {
            echo "::error::$RESOURCE does not render with helm template"
            exit 1
          }
          yq '.' "$RUNNER_TEMP/manifests.yaml" > /dev/null || { echo "::error::$RESOURCE renders invalid YAML"; exit 1; }
          cat "$RUNNER_TEMP/manifests.yaml"
          echo "Argo CD will sync $RESOURCE after the merge into main"
