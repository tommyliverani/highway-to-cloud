name: deploy-crossplane

# Deploy module for tool "crossplane". The actual deploy is GitOps: Argo CD syncs the manifests once the
# resource is merged into main. This module only checks that its manifests are valid Kubernetes objects,
# so a broken resource blocks the merge into main.
on:
  workflow_call:
    inputs:
      resource:
        description: 'Resource folder, e.g. resources/storage1'
        required: true
        type: string
      ref:
        description: 'Commit to deploy'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      RESOURCE: ${{ inputs.resource }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # A Crossplane component is plain manifests (the XR), applied by its Argo CD Application.
      - name: Validate manifests
        run: |
          [[ "$RESOURCE" =~ ^resources/[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid resource '$RESOURCE'"; exit 1; }
          found=0
          while IFS= read -r -d '' f; do
            found=1
            yq -o=json '.' "$f" | jq -se 'all(.[]; .apiVersion and .kind)' > /dev/null || {
              echo "::error::$f is not a valid Kubernetes manifest (apiVersion and kind are required)"
              exit 1
            }
            echo "OK $f"
          done < <(find "$RESOURCE" -type f \( -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) ! -name metadata.yaml -print0)
          [ "$found" = 1 ] || { echo "::error::$RESOURCE contains no manifest"; exit 1; }
          echo "Argo CD will sync $RESOURCE after the merge into main"
