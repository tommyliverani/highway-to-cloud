name: deploy-crossplane

# Deploy module for tool "crossplane". The actual deploy is GitOps: Argo CD syncs the manifests once the
# resource is promoted to main. This module only checks that the manifests are valid YAML, so a broken
# resource blocks the promotion.
on:
  workflow_call:
    inputs:
      resource:
        description: 'Resource folder, e.g. resources/storage1'
        required: true
        type: string
      ref:
        description: 'Commit to deploy'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      RESOURCE: ${{ inputs.resource }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Validate manifests
        run: |
          [[ "$RESOURCE" =~ ^resources/[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid resource '$RESOURCE'"; exit 1; }
          find "$RESOURCE" -name '*.yaml' -print0 | while IFS= read -r -d '' f; do
            yq '.' "$f" > /dev/null || { echo "::error::$f is not valid YAML"; exit 1; }
            echo "OK $f"
          done
          echo "Argo CD will sync $RESOURCE after promotion to main"
