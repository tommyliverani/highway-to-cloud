name: deploy

# Generic deploy pipeline: finds the components that differ between develop and main (not deployed yet),
# deploys each one with the module of its deploy pipeline (deploy-<deploy>.yaml), merges the deployed
# develop commit into main, then lists the Argo CD Applications to sync by hand. Runs when a templater PR
# is merged into develop.
on:
  push:
    branches: [develop]
    paths: ['resources/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    outputs:
      sha: ${{ steps.find.outputs.sha }}
      terraform: ${{ steps.find.outputs.terraform }}
      argo: ${{ steps.find.outputs.argo }}
      ansible: ${{ steps.find.outputs.ansible }}
      helm: ${{ steps.find.outputs.helm }}
      kubectl: ${{ steps.find.outputs.kubectl }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      # A component is the nearest folder under resources/ with a metadata.yaml, at any depth (e.g.
      # resources/s3-bucket-x/ or resources/argo-apps/s3-bucket-x/); its "deploy" key picks the pipeline.
      - name: Group components by deploy pipeline
        id: find
        run: |
          supported="terraform argo ansible helm kubectl"
          plan='{}'
          components=""
          for file in $(git diff --name-only origin/main HEAD -- resources/); do
            dir=$(dirname "$file")
            while [ "$dir" != "resources" ] && [ "$dir" != "." ] && [ ! -f "$dir/metadata.yaml" ]; do
              dir=$(dirname "$dir")
            done
            if [ -f "$dir/metadata.yaml" ]; then
              components="$components $dir"
            else
              echo "Skip $file: removed or not part of a component (no destroy in this demo)"
            fi
          done
          for dir in $(tr ' ' '\n' <<< "$components" | sort -u); do
            deploy=$(yq '.deploy' "$dir/metadata.yaml")
            if ! echo " $supported " | grep -q " $deploy "; then
              echo "::error::$dir uses deploy '$deploy', which has no deploy module (deploy-$deploy.yaml)"
              exit 1
            fi
            plan=$(jq -c --arg deploy "$deploy" --arg dir "$dir" '.[$deploy] += [$dir]' <<< "$plan")
          done
          echo "Deploy plan:"; jq . <<< "$plan"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          for deploy in $supported; do
            echo "$deploy=$(jq -c --arg deploy "$deploy" '.[$deploy] // []' <<< "$plan")" >> "$GITHUB_OUTPUT"
          done

  # One job per deploy pipeline: GitHub Actions does not allow expressions in `uses:`,
  # so adding a pipeline means adding its module and a job here.
  terraform:
    needs: deploy
    if: needs.deploy.outputs.terraform != '[]'
    strategy:
      fail-fast: false
      matrix:
        resource: ${{ fromJSON(needs.deploy.outputs.terraform) }}
    uses: ./.github/workflows/deploy-terraform.yaml
    with:
      resource: ${{ matrix.resource }}
      ref: ${{ needs.deploy.outputs.sha }}
    secrets: inherit

  argo:
    needs: deploy
    if: needs.deploy.outputs.argo != '[]'
    strategy:
      fail-fast: false
      matrix:
        resource: ${{ fromJSON(needs.deploy.outputs.argo) }}
    uses: ./.github/workflows/deploy-argo.yaml
    with:
      resource: ${{ matrix.resource }}
      ref: ${{ needs.deploy.outputs.sha }}
    secrets: inherit

  ansible:
    needs: deploy
    if: needs.deploy.outputs.ansible != '[]'
    strategy:
      fail-fast: false
      matrix:
        resource: ${{ fromJSON(needs.deploy.outputs.ansible) }}
    uses: ./.github/workflows/deploy-ansible.yaml
    with:
      resource: ${{ matrix.resource }}
      ref: ${{ needs.deploy.outputs.sha }}
    secrets: inherit

  helm:
    needs: deploy
    if: needs.deploy.outputs.helm != '[]'
    strategy:
      fail-fast: false
      matrix:
        resource: ${{ fromJSON(needs.deploy.outputs.helm) }}
    uses: ./.github/workflows/deploy-helm.yaml
    with:
      resource: ${{ matrix.resource }}
      ref: ${{ needs.deploy.outputs.sha }}
    secrets: inherit

  kubectl:
    needs: deploy
    if: needs.deploy.outputs.kubectl != '[]'
    strategy:
      fail-fast: false
      matrix:
        resource: ${{ fromJSON(needs.deploy.outputs.kubectl) }}
    uses: ./.github/workflows/deploy-kubectl.yaml
    with:
      resource: ${{ matrix.resource }}
      ref: ${{ needs.deploy.outputs.sha }}
    secrets: inherit

  # Runs only if no module failed (skipped modules are fine). Only the deployed commit is merged,
  # even if develop moved on meanwhile.
  merge-main:
    needs: [deploy, terraform, argo, ansible, helm, kubectl]
    if: ${{ !failure() && !cancelled() }}
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge develop into main
        env:
          DEPLOYED_SHA: ${{ needs.deploy.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          git merge --no-ff "$DEPLOYED_SHA" -m "chore: merge deployed resources from develop"
          git push origin main

  # Argo CD Applications track main, so they can only be synced after merge-main. This job syncs, one by one,
  # the Application(s) that deliver each deployed argo component: the ones named by its metadata.yaml
  # (argo_application, a name or an ordered list; the template computes them from the resource id with a naming
  # convention), those delivering other Applications (resources/argo-apps) first. The cluster comes from the
  # metadata too (kubeconfig; kubectl and argocd_namespace are optional). Components without kubeconfig, like
  # the local Kind cluster that the GitHub runner cannot reach, are listed to be synced by hand.
  argo-sync:
    needs: [deploy, merge-main]
    if: needs.deploy.outputs.argo != '[]' && needs.merge-main.result == 'success'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.deploy.outputs.sha }}

      - name: Sync the Argo CD Applications
        env:
          COMPONENTS: ${{ needs.deploy.outputs.argo }}
        run: |
          # An error inside $(...) must fail the job, not leave it green having synced nothing.
          set -o pipefail; shopt -s inherit_errexit
          # "<order> <component> <application>"; sort -s keeps the order of the Applications within a component.
          plan=$(jq -r '.[]' <<< "$COMPONENTS" | while read -r dir; do
            order=1; [[ "$dir" == resources/argo-apps/* ]] && order=0
            for app in $(yq '[.argo_application] | flatten | .[] | select(. != null)' "$dir/metadata.yaml"); do
              echo "$order $dir $app"
            done
          done | sort -s -k1,1n)
          [ -n "$plan" ] || { echo "::error::No argo_application found in the deployed argo components"; exit 1; }

          # Setting .operation on an Application is what "Sync" does: the Argo CD controller runs it. The previous
          # operation stays in .status.operationState until the new one starts, so its startedAt tells them apart.
          sync_application() {
            local app=$1 i before started phase
            echo "==> Syncing $app"
            for i in $(seq 1 36); do   # it can be created by the sync of the previous one
              k get application "$app" > /dev/null 2>&1 && break
              [ "$i" = 36 ] && { echo "::error::Application $app does not exist"; return 1; }
              sleep 5
            done
            # Hard refresh first: Argo CD would otherwise sync the revision of main it resolved at its last refresh.
            k annotate application "$app" argocd.argoproj.io/refresh=hard --overwrite > /dev/null
            for i in $(seq 1 12); do
              [ -z "$(k get application "$app" -o jsonpath='{.metadata.annotations.argocd\.argoproj\.io/refresh}' || true)" ] && break
              sleep 5
            done
            before=$(k get application "$app" -o jsonpath='{.status.operationState.startedAt}')
            k patch application "$app" --type merge -p '{"operation":{"initiatedBy":{"username":"argo-sync"},"sync":{}}}' > /dev/null
            for i in $(seq 1 60); do
              started=$(k get application "$app" -o jsonpath='{.status.operationState.startedAt}' || true)
              phase=$(k get application "$app" -o jsonpath='{.status.operationState.phase}' || true)
              if [ -n "$started" ] && [ "$started" != "$before" ]; then
                case "$phase" in
                  Succeeded) echo "Application $app synced"; return 0 ;;
                  Failed|Error) echo "::error::Sync of $app failed: $(k get application "$app" -o jsonpath='{.status.operationState.message}')"; return 1 ;;
                esac
              fi
              sleep 5
            done
            echo "::error::Sync of $app did not finish in 5 minutes"; return 1
          }

          manual=""
          declare -A synced
          while read -r order dir app; do
            [ -n "$app" ] || continue
            meta="$dir/metadata.yaml"
            kubeconfig=$(yq '.kubeconfig // ""' "$meta")
            if [ -z "$kubeconfig" ]; then manual="$manual $app"; continue; fi
            kubectl_bin=$(yq '.kubectl // "kubectl"' "$meta")
            argocd_namespace=$(yq '.argocd_namespace // "argocd"' "$meta")
            [[ "$app" =~ ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$ ]] || { echo "::error::Invalid Application name '$app' in $meta"; exit 1; }
            [[ "$kubeconfig" =~ ^[A-Za-z0-9._/+-]+$ && "$kubectl_bin" =~ ^[A-Za-z0-9._/+-]+$ && "$argocd_namespace" =~ ^[a-z0-9-]+$ ]] || { echo "::error::Invalid kubeconfig, kubectl or argocd_namespace in $meta"; exit 1; }
            [ -f "$kubeconfig" ] || { echo "::error::kubeconfig $kubeconfig not found: is the cluster deployed?"; exit 1; }
            command -v "$kubectl_bin" > /dev/null || { echo "::error::$kubectl_bin not found on the runner"; exit 1; }
            [ -z "${synced[$kubeconfig/$app]:-}" ] || continue
            k() { "$kubectl_bin" --kubeconfig "$kubeconfig" --namespace "$argocd_namespace" "$@"; }
            sync_application "$app"
            synced[$kubeconfig/$app]=1
          done <<< "$plan"

          if [ -n "$manual" ]; then
            apps=$(tr ' ' '\n' <<< "$manual" | awk 'NF && !seen[$0]++')
            echo "Applications to sync by hand, in order:"; echo "$apps"
            {
              echo "## Argo CD: manual sync required"
              echo "The resources are merged into \`main\`. Sync these Applications in this order (Argo CD UI → Sync, or CLI):"
              echo '```bash'
              for app in $apps; do echo "argocd app sync $app"; done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
