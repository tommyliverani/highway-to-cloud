name: deploy

# Generic deploy pipeline: finds the resources that differ between develop and main (not deployed yet),
# deploys each one with the module of its tool (deploy-<tool>.yaml), then merges the deployed develop
# commit into main. Runs when a templater PR is merged into develop.
on:
  push:
    branches: [develop]
    paths: ['resources/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.find.outputs.sha }}
      terraform: ${{ steps.find.outputs.terraform }}
      argo: ${{ steps.find.outputs.argo }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      # A component is the nearest folder under resources/ with a metadata.yaml, at any depth (e.g.
      # resources/s3-bucket-x/ or resources/argo-apps/s3-bucket-x/); its "deploy" key picks the pipeline.
      - name: Group components by deploy pipeline
        id: find
        run: |
          supported="terraform argo"
          plan='{}'
          components=""
          for file in $(git diff --name-only origin/main HEAD -- resources/); do
            dir=$(dirname "$file")
            while [ "$dir" != "resources" ] && [ "$dir" != "." ] && [ ! -f "$dir/metadata.yaml" ]; do
              dir=$(dirname "$dir")
            done
            if [ -f "$dir/metadata.yaml" ]; then
              components="$components $dir"
            else
              echo "Skip $file: removed or not part of a component (no destroy in this demo)"
            fi
          done
          for dir in $(tr ' ' '\n' <<< "$components" | sort -u); do
            deploy=$(yq '.deploy' "$dir/metadata.yaml")
            if ! echo " $supported " | grep -q " $deploy "; then
              echo "::error::$dir uses deploy '$deploy', which has no deploy module (deploy-$deploy.yaml)"
              exit 1
            fi
            plan=$(jq -c --arg deploy "$deploy" --arg dir "$dir" '.[$deploy] += [$dir]' <<< "$plan")
          done
          echo "Deploy plan:"; jq . <<< "$plan"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          for deploy in $supported; do
            echo "$deploy=$(jq -c --arg deploy "$deploy" '.[$deploy] // []' <<< "$plan")" >> "$GITHUB_OUTPUT"
          done

  # One job per deploy pipeline: GitHub Actions does not allow expressions in `uses:`,
  # so adding a pipeline means adding its module and a job here.
  terraform:
    needs: plan
    if: needs.plan.outputs.terraform != '[]'
    strategy:
      fail-fast: false
      matrix:
        resource: ${{ fromJSON(needs.plan.outputs.terraform) }}
    uses: ./.github/workflows/deploy-terraform.yaml
    with:
      resource: ${{ matrix.resource }}
      ref: ${{ needs.plan.outputs.sha }}
    secrets: inherit

  argo:
    needs: plan
    if: needs.plan.outputs.argo != '[]'
    strategy:
      fail-fast: false
      matrix:
        resource: ${{ fromJSON(needs.plan.outputs.argo) }}
    uses: ./.github/workflows/deploy-argo.yaml
    with:
      resource: ${{ matrix.resource }}
      ref: ${{ needs.plan.outputs.sha }}
    secrets: inherit

  # Runs only if no module failed (skipped modules are fine). Only the deployed commit is merged,
  # even if develop moved on meanwhile.
  merge-main:
    needs: [plan, terraform, argo]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge develop into main
        env:
          DEPLOYED_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          git merge --no-ff "$DEPLOYED_SHA" -m "chore: merge deployed resources from develop"
          git push origin main
