name: templater

on:
  workflow_dispatch:
    inputs:
      service_id:
        description: 'Service ID (folder name in ./service-catalog, idpServiceId of the Backstage template)'
        required: true
        type: string
      parameters:
        description: 'JSON object with the Backstage input parameters'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  templater:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.split.outputs.prs }}

    # Inputs reach the script only through env vars, never interpolated into code.
    # develop is the working branch (rendered, not yet deployed); main holds deployed resources only.
    env:
      SERVICE_ID: ${{ inputs.service_id }}
      PARAMETERS: ${{ inputs.parameters }}
      WORK_BRANCH: develop

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORK_BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Dependencies, script and state live outside the checkout, so they never end up in the PR.
      - name: Prepare templating script
        run: |
          IDP_DIR="$RUNNER_TEMP/idp"
          mkdir -p "$IDP_DIR"
          npm install --no-save --silent --prefix "$IDP_DIR" nunjucks@3 js-yaml@4
          echo "NODE_PATH=$IDP_DIR/node_modules" >> "$GITHUB_ENV"
          echo "STATE_DIR=$IDP_DIR/state" >> "$GITHUB_ENV"
          echo "IDP_SCRIPT=$IDP_DIR/template.js" >> "$GITHUB_ENV"

          # Quoted delimiter: the shell does not expand anything inside the script.
          cat > "$IDP_DIR/template.js" <<'EOF'
          // IDP templating process: node template.js <values|templates|load|render>
          // Env: SERVICE_ID, PARAMETERS (JSON), GITHUB_REPOSITORY, STATE_DIR (JSON files passed between steps).
          const fs = require("fs");
          const os = require("os");
          const path = require("path");
          const yaml = require("js-yaml");
          const nunjucks = require("nunjucks");

          const REPO_ROOT = process.cwd();
          const STATE_DIR = process.env.STATE_DIR || path.join(os.tmpdir(), "idp-state");
          const RESERVED_KEYS = ["parameters", "old_values", "resource_id"];
          const DATA_EXTENSIONS = [".json", ".yaml", ".yml"];
          const RESOURCE_CATALOG_DIR = "resource-catalog";
          const TOOL_ANNOTATION = "highwaytocloud.io/tool";
          const SERVICE_ANNOTATION = "highwaytocloud.io/service";
          const TOOL_PATTERN = /^[A-Za-z0-9_-]+$/;
          const RESOURCE_ID_PATTERN = /^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$/;

          const env = new nunjucks.Environment(null, {
            autoescape: false,
            trimBlocks: true,
            lstripBlocks: true,
            throwOnUndefined: false,
          });
          env.addFilter("kebabCase", (s) =>
            s ? String(s).trim().replace(/([a-z])([A-Z])/g, "$1-$2").replace(/[\s_]+/g, "-").toLowerCase() : "");
          env.addFilter("camelCase", (s) =>
            s ? String(s).trim().replace(/[-_\s]+(.)?/g, (_, c) => (c ? c.toUpperCase() : "")) : "");
          env.addFilter("snakeCase", (s) =>
            s ? String(s).trim().replace(/([a-z])([A-Z])/g, "$1_$2").replace(/[\s-]+/g, "_").toLowerCase() : "");

          function fail(message) {
            console.error(`::error::${message}`);
            process.exit(1);
          }

          function readState(name) {
            return JSON.parse(fs.readFileSync(path.join(STATE_DIR, `${name}.json`), "utf8"));
          }

          function writeState(name, data) {
            fs.mkdirSync(STATE_DIR, { recursive: true });
            fs.writeFileSync(path.join(STATE_DIR, `${name}.json`), JSON.stringify(data, null, 2));
          }

          function loadYaml(file) {
            return yaml.load(fs.readFileSync(file, "utf8"));
          }

          // Sources follow the Terraform module convention <repo>//<path>, e.g.
          // github.com/owner/repo//templates/s3 (https://github.com/... and git@github.com:....git also work).
          // This demo is a monorepo: the repository must be the one running the workflow.
          function resolveSource(source, field) {
            const match = String(source || "").trim()
              .match(/^(?:https:\/\/github\.com\/|git@github\.com:|github\.com\/)([^/]+\/[^/]+?)(?:\.git)?\/\/(.+)$/);
            if (!match) fail(`${field} "${source}" is not a <repo>//<path> source (e.g. github.com/owner/repo//path)`);
            const current = (process.env.GITHUB_REPOSITORY || "").toLowerCase();
            if (current && match[1].toLowerCase() !== current) {
              fail(`${field} "${source}" is not this repository (${current}): multi-repo is not supported in this demo`);
            }
            return repoPath(match[2], field);
          }

          // Resolves a repo-relative path (e.g. "resources/foo") and refuses anything outside the repo.
          function repoPath(p, field) {
            if (!/^[A-Za-z0-9._/-]+$/.test(String(p || ""))) fail(`${field} "${p}" contains invalid characters`);
            const resolved = path.resolve(REPO_ROOT, String(p || "").replace(/^\/+/, ""));
            if (resolved !== REPO_ROOT && !resolved.startsWith(REPO_ROOT + path.sep)) {
              fail(`${field} "${p}" points outside the repository`);
            }
            return resolved;
          }

          function serviceDir() {
            const serviceId = process.env.SERVICE_ID || "";
            if (!/^[A-Za-z0-9_-]+$/.test(serviceId)) fail(`Invalid service id "${serviceId}"`);
            const dir = repoPath(`service-catalog/${serviceId}`, "service_id");
            if (!fs.existsSync(dir)) fail(`Service "${serviceId}" not found in service-catalog/`);
            return dir;
          }

          // 1) Merge every interface of the service (under its alias) with the input parameters.
          function buildValues() {
            let parameters;
            try {
              parameters = JSON.parse(process.env.PARAMETERS || "{}");
            } catch (e) {
              fail(`PARAMETERS is not valid JSON: ${e.message}`);
            }

            const interfaces = loadYaml(path.join(serviceDir(), "interfaces.yaml")) || [];
            if (!Array.isArray(interfaces)) fail("interfaces.yaml must be a list");

            const values = {};
            interfaces.forEach((item, i) => {
              const { alias, source } = item || {};
              if (!alias || !source) fail(`interfaces.yaml entry ${i} needs alias and source`);
              if (RESERVED_KEYS.includes(alias)) fail(`Interface alias "${alias}" is reserved`);
              if (alias in values) fail(`Interface alias "${alias}" is declared twice`);
              const file = resolveSource(source, `interfaces[${i}].source`);
              if (!fs.existsSync(file)) fail(`Interface ${source} not found`);
              values[alias] = loadYaml(file) || {};
              console.log(`Loaded interface ${path.relative(REPO_ROOT, file)} as "${alias}"`);
            });

            values.parameters = parameters;
            writeState("values", values);
          }

          // 2) Resolve the instance from service-info.yaml: its resourceId, its tool (recorded in the resource
          //    catalog, or default_tool for a new instance) and the components of that tool's recipe.
          //    Strings are rendered after YAML parsing, so input parameters cannot inject extra YAML keys.
          function resolveInstance() {
            const values = readState("values");
            const info = loadYaml(path.join(serviceDir(), "service-info.yaml")) || {};
            if (typeof info !== "object" || Array.isArray(info)) fail("service-info.yaml must be a mapping");
            if (typeof info.create !== "boolean") fail("service-info.yaml: create must be true or false");

            const renderIn = (context) => (v) => (typeof v === "string" ? env.renderString(v, context).trim() : v);
            const resourceId = renderIn(values)(info.resourceId || "");
            if (!RESOURCE_ID_PATTERN.test(resourceId)) {
              fail(`Invalid resourceId "${resourceId}": lowercase letters, numbers and hyphens, max 63 characters`);
            }

            const catalogFile = path.join(REPO_ROOT, RESOURCE_CATALOG_DIR, `${resourceId}.yaml`);
            const existing = fs.existsSync(catalogFile);
            let tool;
            if (existing) {
              if (info.create) fail(`Resource ${resourceId} already exists in ${RESOURCE_CATALOG_DIR}/`);
              const annotations = ((loadYaml(catalogFile) || {}).metadata || {}).annotations || {};
              tool = annotations[TOOL_ANNOTATION];
              if (!tool) fail(`${RESOURCE_CATALOG_DIR}/${resourceId}.yaml has no ${TOOL_ANNOTATION} annotation`);
            } else {
              if (!info.create) fail(`Resource ${resourceId} not found in ${RESOURCE_CATALOG_DIR}/`);
              tool = info.default_tool;
              if (!tool) fail("service-info.yaml: default_tool is required when create is true");
            }
            if (!TOOL_PATTERN.test(tool)) fail(`Invalid tool "${tool}"`);
            const recipe = info[tool];
            if (!Array.isArray(recipe) || !recipe.length) fail(`Service has no "${tool}" implementation`);

            // The recipe of each tool lists its components with the full template path (tool folder included);
            // how a component is deployed is declared by its template's metadata.yaml.
            const context = { ...values, resource_id: resourceId };
            const components = recipe.map((entry, i) => {
              const c = Object.fromEntries(Object.entries(entry || {}).map(([k, v]) => [k, renderIn(context)(v)]));
              for (const key of ["template", "resource"]) {
                if (!c[key]) fail(`service-info.yaml ${tool}[${i}] is missing ${key}`);
              }
              console.log(`Component ${c.template} -> ${c.resource}`);
              return c;
            });

            console.log(`Resource ${resourceId}: ${existing ? "existing" : "new"}, tool ${tool}`);
            writeState("values", context);
            writeState("instance", { resource_id: resourceId, tool, create: info.create, components });
          }

          // <name>.<ext>.njk renders to <name>.<ext>; a bare <name>.njk renders to <name>.yaml.
          function renderedName(rel) {
            const target = rel.slice(0, -".njk".length);
            return path.extname(target) ? target : `${target}.yaml`;
          }

          // 3) For each <name>.njk of a component's template, the file it renders to (<name>), if it already
          //    exists in the component, is loaded as the old_values of that template. Only data files
          //    (.json/.yaml/.yml) are loaded; a data file may have changed format (e.g. variables.yaml ->
          //    variables.json), so any data extension with the same base name is accepted.
          function loadComponents() {
            const instance = readState("instance");
            instance.components = instance.components.map((c, i) => {
              const dir = resolveSource(c.resource, `components[${i}].resource`);
              const templateDir = resolveSource(c.template, `components[${i}].template`);
              if (!fs.existsSync(templateDir)) fail(`Template ${c.template} not found`);
              const name = path.relative(REPO_ROOT, dir);
              const exists = fs.existsSync(dir);

              const oldValues = {};
              for (const rel of listFiles(templateDir).filter((f) => f.endsWith(".njk"))) {
                const target = renderedName(rel);
                const ext = path.extname(target);
                if (!DATA_EXTENSIONS.includes(ext)) continue;
                const base = target.slice(0, -ext.length);
                const found = DATA_EXTENSIONS.map((e) => base + e).filter((f) => fs.existsSync(path.join(dir, f)));
                if (found.length > 1) fail(`${name} has more than one ${base}.* file`);
                if (found.length) {
                  oldValues[rel] = loadYaml(path.join(dir, found[0])) || {};
                  console.log(`Component ${name}: ${found[0]} loaded as old_values of ${rel}`);
                }
              }

              console.log(exists ? `Component ${name} exists` : `Component ${name} is new`);
              return { ...c, exists, old_values: oldValues };
            });

            writeState("instance", instance);
          }

          function listFiles(dir, base = dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? listFiles(full, base) : [path.relative(base, full)];
            });
          }

          const removeBlankLines = (content) => {
            const lines = content.split(/\r?\n/).filter((line) => line.trim() !== "");
            return lines.length ? `${lines.join("\n")}\n` : "";
          };

          // Data files (.json/.yaml/.yml) are parsed as YAML (JSON is a subset), so broken output fails here
          // and .json targets are always valid JSON even if the template is written in YAML syntax.
          // Switching format (e.g. variables.yaml -> variables.json) removes the stale sibling.
          function writeRendered(dest, rendered, source) {
            const ext = path.extname(dest);
            let content = rendered;
            if (DATA_EXTENSIONS.includes(ext)) {
              let data;
              try {
                data = yaml.load(rendered);
              } catch (e) {
                fail(`${source} does not render valid YAML/JSON: ${e.message}`);
              }
              content = ext === ".json" ? `${JSON.stringify(data ?? {}, null, 2)}\n` : removeBlankLines(rendered);
              const base = dest.slice(0, -ext.length);
              for (const other of DATA_EXTENSIONS.filter((e) => e !== ext)) {
                if (fs.existsSync(base + other)) {
                  fs.rmSync(base + other);
                  console.log(`Removed  ${path.relative(REPO_ROOT, base + other)} (replaced by ${ext})`);
                }
              }
            }
            fs.mkdirSync(path.dirname(dest), { recursive: true });
            fs.writeFileSync(dest, content);
            console.log(`Rendered ${path.relative(REPO_ROOT, dest)}`);
          }

          // A new instance is recorded in the resource catalog as a Backstage Resource entity, rendered from the
          // service's optional catalog-info.njk. The resourceId is internal to the platform: it only names the
          // file, while the entity keeps the user-facing name. Annotations are always set by the process.
          function writeCatalogEntry(instance, values) {
            let entity = {
              apiVersion: "backstage.io/v1alpha1",
              kind: "Resource",
              metadata: {},
              spec: { type: "platform-resource", owner: "guest", lifecycle: "production" },
            };
            const template = path.join(serviceDir(), "catalog-info.njk");
            if (fs.existsSync(template)) {
              try {
                entity = yaml.load(env.renderString(fs.readFileSync(template, "utf8"), values)) || {};
              } catch (e) {
                fail(`catalog-info.njk does not render valid YAML: ${e.message}`);
              }
            }
            const name = (entity.metadata || {}).name || values.parameters.name;
            if (!RESOURCE_ID_PATTERN.test(String(name || ""))) fail(`Invalid entity name "${name}" for the resource catalog`);
            entity.metadata = { ...(entity.metadata || {}), name };
            entity.metadata.annotations = {
              ...(entity.metadata.annotations || {}),
              [TOOL_ANNOTATION]: instance.tool,
              [SERVICE_ANNOTATION]: process.env.SERVICE_ID,
            };
            const dest = path.join(REPO_ROOT, RESOURCE_CATALOG_DIR, `${instance.resource_id}.yaml`);
            fs.mkdirSync(path.dirname(dest), { recursive: true });
            fs.writeFileSync(dest, yaml.dump(entity, { lineWidth: -1 }));
            console.log(`Recorded ${path.relative(REPO_ROOT, dest)} (tool: ${instance.tool})`);
          }

          // 4) Copy each component's template folder into the component folder. <name>.<ext>.njk renders to <name>.<ext>;
          //    a bare <name>.njk renders to <name>.yaml. Other files are copied as-is.
          //    Each component becomes its own pull request (in a multi-repo setup, one per repository): the
          //    render step lists them in prs.json with the paths they own and their PR body.
          function renderComponents() {
            const values = readState("values");
            const instance = readState("instance");
            const total = instance.components.length;

            const prs = instance.components.map((r, i) => {
              const resourceDir = resolveSource(r.resource, `components[${i}].resource`);
              const templateDir = resolveSource(r.template, `components[${i}].template`);
              const templateName = path.relative(REPO_ROOT, templateDir);
              if (!fs.existsSync(templateDir)) fail(`Template ${r.template} not found`);

              for (const rel of listFiles(templateDir)) {
                const src = path.join(templateDir, rel);
                if (rel.endsWith(".njk")) {
                  const context = { ...values };
                  if (r.old_values[rel]) context.old_values = r.old_values[rel];
                  const dest = path.join(resourceDir, renderedName(rel));
                  writeRendered(dest, env.renderString(fs.readFileSync(src, "utf8"), context), rel);
                } else {
                  const dest = path.join(resourceDir, rel);
                  fs.mkdirSync(path.dirname(dest), { recursive: true });
                  fs.copyFileSync(src, dest);
                  console.log(`Copied   ${path.relative(REPO_ROOT, dest)}`);
                }
              }

              // metadata.yaml is declared by the creation template and tells which deploy pipeline applies.
              const metadataFile = path.join(resourceDir, "metadata.yaml");
              const deploy = fs.existsSync(metadataFile) ? (loadYaml(metadataFile) || {}).deploy : null;
              if (!deploy) fail(`${path.relative(REPO_ROOT, resourceDir)} has no metadata.yaml with a deploy key: declare it in ${templateName}`);

              const name = path.relative(REPO_ROOT, resourceDir);
              const body = [
                `Resource \`${instance.resource_id}\` — ${instance.create ? "created" : "updated"} with tool ` +
                  `\`${instance.tool}\`: component ${i + 1} of ${total}.`,
                "",
                `- \`${name}\` — ${r.exists ? "updated" : "created"}, template \`${templateName}\`, deploy \`${deploy}\``,
                ...(total > 1 ? ["", "Merge the pull requests of this resource in order (component 1 first)."] : []),
              ];
              fs.writeFileSync(path.join(STATE_DIR, `pr-${i}.md`), `${body.join("\n")}\n`);
              return { index: i, name, paths: [name], title: `IDP: ${process.env.SERVICE_ID} ${instance.resource_id} (${i + 1}/${total})` };
            });

            if (instance.create) writeCatalogEntry(instance, values);
            writeState("prs", prs);
          }

          const commands = { values: buildValues, instance: resolveInstance, load: loadComponents, render: renderComponents };
          const command = commands[process.argv[2]];
          if (!command) fail(`Usage: node template.js <${Object.keys(commands).join("|")}>`);
          command();
          EOF

      - name: 1) Build values from interfaces and parameters
        run: node "$IDP_SCRIPT" values

      - name: 2) Resolve the resource and its components
        run: node "$IDP_SCRIPT" instance

      - name: 3) Load existing components
        run: node "$IDP_SCRIPT" load

      - name: 4) Render components and resource catalog
        run: node "$IDP_SCRIPT" render

      # The instance is recorded (and its resourceId reserved) before any component PR exists: the
      # resource catalog is platform bookkeeping, not a component. It reaches main, and so Backstage, with
      # the next deploy (merge-main merges develop). A concurrent run that recorded the same resourceId
      # makes the rebase fail.
      - name: 5) Record the instance in the resource catalog
        run: |
          [ -n "$(git status --porcelain -- resource-catalog)" ] || { echo "No new instance to record"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- resource-catalog
          entry=$(git diff --cached --name-only -- resource-catalog)
          git commit -q -m "feat($SERVICE_ID): record $entry"
          git pull --rebase --autostash origin "$WORK_BRANCH" || {
            echo "::error::$entry was recorded by another request in the meantime"; exit 1; }
          git push origin "HEAD:$WORK_BRANCH"
          echo "Recorded $entry on $WORK_BRANCH"

      # One patch per component (with its PR body), handed to the pull-requests job.
      - name: 6) Split changes by component
        id: split
        run: |
          PRS_DIR="$RUNNER_TEMP/idp/prs"
          mkdir -p "$PRS_DIR"
          git add -A
          jq -c '.[]' "$STATE_DIR/prs.json" | while read -r pr; do
            index=$(jq -r '.index' <<< "$pr")
            mapfile -t paths < <(jq -r '.paths[]' <<< "$pr")
            git diff --cached --binary -- "${paths[@]}" > "$PRS_DIR/$index.patch"
            cp "$STATE_DIR/pr-$index.md" "$PRS_DIR/$index.md"
            echo "Component $index: $(git diff --cached --name-only -- "${paths[@]}" | wc -l) changed files"
          done
          echo "prs=$(jq -c '[.[] | {index, name, title}]' "$STATE_DIR/prs.json")" >> "$GITHUB_OUTPUT"

      - name: Upload component patches
        uses: actions/upload-artifact@v4
        with:
          name: idp-components
          path: ${{ runner.temp }}/idp/prs

  # One pull request per component, in the component's repository (this one in the demo).
  pull-requests:
    needs: templater
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.templater.outputs.prs) }}

    env:
      WORK_BRANCH: develop
      INDEX: ${{ matrix.pr.index }}

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORK_BRANCH }}

      - name: Download component patches
        uses: actions/download-artifact@v4
        with:
          name: idp-components
          path: ${{ runner.temp }}/prs

      - name: Apply component changes
        run: |
          patch="$RUNNER_TEMP/prs/$INDEX.patch"
          if [ -s "$patch" ]; then git apply --index "$patch"; else echo "No changes for this component"; fi

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ env.WORK_BRANCH }}
          branch: idp/${{ inputs.service_id }}-${{ github.run_id }}-${{ matrix.pr.index }}
          delete-branch: true
          commit-message: 'feat(${{ inputs.service_id }}): render ${{ matrix.pr.name }}'
          title: ${{ matrix.pr.title }}
          body-path: ${{ runner.temp }}/prs/${{ matrix.pr.index }}.md
