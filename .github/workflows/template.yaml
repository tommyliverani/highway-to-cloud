name: templater

on:
  workflow_dispatch:
    inputs:
      service_id:
        description: 'Service ID (folder name in ./service-catalog, idpServiceId of the Backstage template)'
        required: true
        type: string
      parameters:
        description: 'JSON object with the Backstage input parameters'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  templater:
    runs-on: ubuntu-latest

    # Inputs reach the script only through env vars, never interpolated into code.
    env:
      SERVICE_ID: ${{ inputs.service_id }}
      PARAMETERS: ${{ inputs.parameters }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Dependencies, script and state live outside the checkout, so they never end up in the PR.
      - name: Prepare templating script
        run: |
          IDP_DIR="$RUNNER_TEMP/idp"
          mkdir -p "$IDP_DIR"
          npm install --no-save --silent --prefix "$IDP_DIR" nunjucks@3 js-yaml@4
          echo "NODE_PATH=$IDP_DIR/node_modules" >> "$GITHUB_ENV"
          echo "STATE_DIR=$IDP_DIR/state" >> "$GITHUB_ENV"
          echo "IDP_SCRIPT=$IDP_DIR/template.js" >> "$GITHUB_ENV"

          # Quoted delimiter: the shell does not expand anything inside the script.
          cat > "$IDP_DIR/template.js" <<'EOF'
          // IDP templating process: node template.js <values|templates|load|render>
          // Env: SERVICE_ID, PARAMETERS (JSON), GITHUB_REPOSITORY, STATE_DIR (JSON files passed between steps).
          const fs = require("fs");
          const os = require("os");
          const path = require("path");
          const yaml = require("js-yaml");
          const nunjucks = require("nunjucks");

          const REPO_ROOT = process.cwd();
          const STATE_DIR = process.env.STATE_DIR || path.join(os.tmpdir(), "idp-state");
          const RESERVED_KEYS = ["parameters", "old_values"];

          const env = new nunjucks.Environment(null, {
            autoescape: false,
            trimBlocks: true,
            lstripBlocks: true,
            throwOnUndefined: false,
          });
          env.addFilter("kebabCase", (s) =>
            s ? String(s).trim().replace(/([a-z])([A-Z])/g, "$1-$2").replace(/[\s_]+/g, "-").toLowerCase() : "");
          env.addFilter("camelCase", (s) =>
            s ? String(s).trim().replace(/[-_\s]+(.)?/g, (_, c) => (c ? c.toUpperCase() : "")) : "");
          env.addFilter("snakeCase", (s) =>
            s ? String(s).trim().replace(/([a-z])([A-Z])/g, "$1_$2").replace(/[\s-]+/g, "_").toLowerCase() : "");

          function fail(message) {
            console.error(`::error::${message}`);
            process.exit(1);
          }

          function readState(name) {
            return JSON.parse(fs.readFileSync(path.join(STATE_DIR, `${name}.json`), "utf8"));
          }

          function writeState(name, data) {
            fs.mkdirSync(STATE_DIR, { recursive: true });
            fs.writeFileSync(path.join(STATE_DIR, `${name}.json`), JSON.stringify(data, null, 2));
          }

          function loadYaml(file) {
            return yaml.load(fs.readFileSync(file, "utf8"));
          }

          // This demo is a monorepo: every *_url must point to the repository running the workflow.
          function assertCurrentRepo(url, field) {
            const match = String(url || "").trim()
              .match(/^(?:git@github\.com:|https:\/\/github\.com\/)([^/]+\/[^/]+?)(?:\.git)?\/?$/);
            const current = (process.env.GITHUB_REPOSITORY || "").toLowerCase();
            if (!match) fail(`${field} "${url}" is not a GitHub repository URL`);
            if (current && match[1].toLowerCase() !== current) {
              fail(`${field} "${url}" is not this repository (${current}): multi-repo is not supported in this demo`);
            }
          }

          // Resolves a repo-relative path (e.g. "/resources/foo") and refuses anything outside the repo.
          function repoPath(p, field) {
            if (!/^[A-Za-z0-9._/-]+$/.test(String(p || ""))) fail(`${field} "${p}" contains invalid characters`);
            const resolved = path.resolve(REPO_ROOT, String(p || "").replace(/^\/+/, ""));
            if (resolved !== REPO_ROOT && !resolved.startsWith(REPO_ROOT + path.sep)) {
              fail(`${field} "${p}" points outside the repository`);
            }
            return resolved;
          }

          function serviceDir() {
            const serviceId = process.env.SERVICE_ID || "";
            if (!/^[A-Za-z0-9_-]+$/.test(serviceId)) fail(`Invalid service id "${serviceId}"`);
            const dir = repoPath(`service-catalog/${serviceId}`, "service_id");
            if (!fs.existsSync(dir)) fail(`Service "${serviceId}" not found in service-catalog/`);
            return dir;
          }

          // 1) Merge every interface of the service (under its alias) with the input parameters.
          function buildValues() {
            let parameters;
            try {
              parameters = JSON.parse(process.env.PARAMETERS || "{}");
            } catch (e) {
              fail(`PARAMETERS is not valid JSON: ${e.message}`);
            }

            const interfaces = loadYaml(path.join(serviceDir(), "interfaces.yaml")) || [];
            if (!Array.isArray(interfaces)) fail("interfaces.yaml must be a list");

            const values = {};
            interfaces.forEach((item, i) => {
              const { alias, repo_url: repoUrl, path: filePath } = item || {};
              if (!alias || !filePath) fail(`interfaces.yaml entry ${i} needs alias and path`);
              if (RESERVED_KEYS.includes(alias)) fail(`Interface alias "${alias}" is reserved`);
              if (alias in values) fail(`Interface alias "${alias}" is declared twice`);
              assertCurrentRepo(repoUrl, `interfaces[${i}].repo_url`);
              const file = repoPath(filePath, `interfaces[${i}].path`);
              if (!fs.existsSync(file)) fail(`Interface file ${filePath} not found`);
              values[alias] = loadYaml(file) || {};
              console.log(`Loaded interface ${filePath} as "${alias}"`);
            });

            values.parameters = parameters;
            writeState("values", values);
          }

          // 2) Render templates.yaml with the values. Each string is rendered after YAML parsing,
          //    so input parameters cannot inject extra YAML keys.
          function resolveTemplates() {
            const values = readState("values");
            const raw = loadYaml(path.join(serviceDir(), "templates.yaml")) || [];
            if (!Array.isArray(raw)) fail("templates.yaml must be a list");

            const render = (v) => (typeof v === "string" ? env.renderString(v, values).trim() : v);
            const templates = raw.map((entry, i) => {
              const t = Object.fromEntries(Object.entries(entry || {}).map(([k, v]) => [k, render(v)]));
              for (const key of ["template_url", "template_path", "resource_url", "resource_path", "default_tool"]) {
                if (!t[key]) fail(`templates.yaml entry ${i} is missing ${key}`);
              }
              console.log(`Template ${t.template_path} -> ${t.resource_path} (default tool: ${t.default_tool})`);
              return t;
            });

            writeState("templates", templates);
          }

          // 3) For each template, detect whether the resource already exists and load its previous state.
          function loadResources() {
            const templates = readState("templates");
            const resources = templates.map((t, i) => {
              assertCurrentRepo(t.resource_url, `templates[${i}].resource_url`);
              const dir = repoPath(t.resource_path, `templates[${i}].resource_path`);
              const exists = fs.existsSync(dir);
              const variablesFile = path.join(dir, "variables.yaml");
              const metadataFile = path.join(dir, "metadata.yaml");

              const resource = { ...t, exists, existing_tool: null, old_values: null };
              if (exists && fs.existsSync(variablesFile)) resource.old_values = loadYaml(variablesFile) || {};
              if (exists && fs.existsSync(metadataFile)) resource.existing_tool = (loadYaml(metadataFile) || {}).tool || null;

              console.log(exists
                ? `Resource ${t.resource_path} exists (tool: ${resource.existing_tool || "none"}, old values: ${resource.old_values ? "yes" : "no"})`
                : `Resource ${t.resource_path} is new`);
              return resource;
            });

            writeState("resources", resources);
          }

          function listFiles(dir, base = dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? listFiles(full, base) : [path.relative(base, full)];
            });
          }

          const removeBlankLines = (content) => {
            const lines = content.split(/\r?\n/).filter((line) => line.trim() !== "");
            return lines.length ? `${lines.join("\n")}\n` : "";
          };

          // 4) Copy templates/<path>/<tool> into the resource, rendering *.njk (-> *.yaml) with the values.
          function renderResources() {
            const values = readState("values");
            const resources = readState("resources");
            const summary = [];

            resources.forEach((r, i) => {
              const tool = r.existing_tool || r.default_tool;
              if (!/^[A-Za-z0-9_-]+$/.test(tool)) fail(`Invalid tool "${tool}" for ${r.resource_path}`);
              assertCurrentRepo(r.template_url, `templates[${i}].template_url`);
              const templateDir = repoPath(path.posix.join(r.template_path, tool), `templates[${i}].template_path`);
              if (!fs.existsSync(templateDir)) fail(`Template ${r.template_path} has no "${tool}" implementation`);

              const resourceDir = repoPath(r.resource_path, `templates[${i}].resource_path`);
              const context = { ...values };
              if (r.old_values) context.old_values = r.old_values;

              for (const rel of listFiles(templateDir)) {
                const src = path.join(templateDir, rel);
                if (rel.endsWith(".njk")) {
                  const dest = path.join(resourceDir, rel.replace(/\.njk$/, ".yaml"));
                  fs.mkdirSync(path.dirname(dest), { recursive: true });
                  fs.writeFileSync(dest, removeBlankLines(env.renderString(fs.readFileSync(src, "utf8"), context)));
                  console.log(`Rendered ${path.relative(REPO_ROOT, dest)}`);
                } else {
                  const dest = path.join(resourceDir, rel);
                  fs.mkdirSync(path.dirname(dest), { recursive: true });
                  fs.copyFileSync(src, dest);
                  console.log(`Copied   ${path.relative(REPO_ROOT, dest)}`);
                }
              }

              const metadataFile = path.join(resourceDir, "metadata.yaml");
              if (!fs.existsSync(metadataFile)) {
                fs.writeFileSync(metadataFile, yaml.dump({ tool }));
                console.log(`Created  ${path.relative(REPO_ROOT, metadataFile)} (tool: ${tool})`);
              }

              summary.push(`- \`${path.relative(REPO_ROOT, resourceDir)}\` — ${r.exists ? "updated" : "created"}, ` +
                `template \`${r.template_path}/${tool}\``);
            });

            fs.writeFileSync(path.join(STATE_DIR, "summary.md"), `${summary.join("\n")}\n`);
          }

          const commands = { values: buildValues, templates: resolveTemplates, load: loadResources, render: renderResources };
          const command = commands[process.argv[2]];
          if (!command) fail(`Usage: node template.js <${Object.keys(commands).join("|")}>`);
          command();
          EOF

      - name: 1) Build values from interfaces and parameters
        run: node "$IDP_SCRIPT" values

      - name: 2) Resolve service templates
        run: node "$IDP_SCRIPT" templates

      - name: 3) Load existing resources
        run: node "$IDP_SCRIPT" load

      - name: 4) Render resources
        run: node "$IDP_SCRIPT" render

      - name: 5) Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: idp/${{ inputs.service_id }}-${{ github.run_id }}
          delete-branch: true
          commit-message: 'feat(${{ inputs.service_id }}): render resources'
          title: 'IDP: ${{ inputs.service_id }}'
          body-path: ${{ runner.temp }}/idp/state/summary.md
