name: deploy-terraform

# Deploy module for tool "terraform": init + apply of one resource folder.
on:
  workflow_call:
    inputs:
      resource:
        description: 'Resource folder, e.g. resources/bucket1'
        required: true
        type: string
      ref:
        description: 'Commit to deploy'
        required: true
        type: string

jobs:
  apply:
    runs-on: ubuntu-latest

    env:
      RESOURCE: ${{ inputs.resource }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ADMIN_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ADMIN_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check inputs and configuration
        run: |
          [[ "$RESOURCE" =~ ^resources/[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid resource '$RESOURCE'"; exit 1; }
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || { echo "::error::$v is not set (repository secrets)"; exit 1; }
          done

      # variables.json holds both the Terraform variables and a "backend" object: backend blocks cannot
      # use variables, so the backend goes to -backend-config and everything else to -var-file.
      # Terraform only reads .json files as JSON; variables.yaml (older resources) is converted.
      - name: Prepare variables and backend
        run: |
          all="$RUNNER_TEMP/variables.all.json"
          if [ -f "$RESOURCE/variables.json" ]; then
            cp "$RESOURCE/variables.json" "$all"
          else
            yq -o=json "$RESOURCE/variables.yaml" > "$all"
          fi
          jq -e '.backend | objects' "$all" > "$RUNNER_TEMP/backend.json" || {
            echo "::error::$RESOURCE variables file has no \"backend\" object (bucket, region, key)"
            exit 1
          }
          jq 'del(.backend)' "$all" > "$RUNNER_TEMP/variables.tfvars.json"
          echo "BACKEND_FILE=$RUNNER_TEMP/backend.json" >> "$GITHUB_ENV"
          echo "VAR_FILE=$RUNNER_TEMP/variables.tfvars.json" >> "$GITHUB_ENV"
          echo "Backend:"; jq . "$RUNNER_TEMP/backend.json"

      # Turns the opaque backend error (STS InvalidClientTokenId) into an explicit diagnosis.
      - name: Check AWS credentials
        run: |
          if [[ ! "$AWS_ACCESS_KEY_ID" =~ ^(AKIA|ASIA)[A-Z0-9]{16}$ ]]; then
            echo "::error::AWS_ADMIN_ACCESS_KEY is not an access key ID (length ${#AWS_ACCESS_KEY_ID}, expected 20 chars starting with AKIA): wrong value, swapped secrets or extra spaces/newlines"
            exit 1
          fi
          region=$(jq -r '.region' "$BACKEND_FILE")
          echo "Identity (us-east-1):"
          aws sts get-caller-identity --region us-east-1 --query Arn --output text || {
            echo "::error::AWS rejects the credentials: the access key is deleted/inactive or the secret key does not match it"
            exit 1
          }
          echo "Identity in the state region ($region):"
          aws sts get-caller-identity --region "$region" --query Arn --output text || {
            echo "::error::The credentials are valid but not in $region: the region is not enabled for this AWS account"
            exit 1
          }

      - name: Terraform init
        run: terraform -chdir="$RESOURCE" init -input=false -backend-config="$BACKEND_FILE"

      - name: Terraform apply
        run: terraform -chdir="$RESOURCE" apply -input=false -auto-approve -var-file="$VAR_FILE"
