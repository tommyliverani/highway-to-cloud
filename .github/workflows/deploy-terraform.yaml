name: deploy-terraform

# Deploy module for tool "terraform": init + apply of one resource folder.
on:
  workflow_call:
    inputs:
      resource:
        description: 'Resource folder, e.g. resources/bucket1'
        required: true
        type: string
      ref:
        description: 'Commit to deploy'
        required: true
        type: string

jobs:
  apply:
    runs-on: ubuntu-latest

    env:
      RESOURCE: ${{ inputs.resource }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ADMIN_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ADMIN_SECRET_ACCESS_KEY }}
      TF_IN_AUTOMATION: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check inputs and configuration
        run: |
          [[ "$RESOURCE" =~ ^resources/[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid resource '$RESOURCE'"; exit 1; }
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [ -n "${!v}" ] || { echo "::error::$v is not set (repository secrets)"; exit 1; }
          done

      # Terraform only reads .tfvars / .tfvars.json: variables.yaml (older resources) is converted.
      - name: Prepare variables
        run: |
          var_file="$RUNNER_TEMP/variables.tfvars.json"
          if [ -f "$RESOURCE/variables.json" ]; then
            cp "$RESOURCE/variables.json" "$var_file"
          else
            yq -o=json "$RESOURCE/variables.yaml" > "$var_file"
          fi
          echo "VAR_FILE=$var_file" >> "$GITHUB_ENV"

      # The backend (state bucket, region, key) is written in the resource's terraform.tf at render time.
      - name: Terraform init
        run: terraform -chdir="$RESOURCE" init -input=false

      - name: Terraform apply
        run: terraform -chdir="$RESOURCE" apply -input=false -auto-approve -var-file="$VAR_FILE"
