name: deploy-argo

# Deploy module for "deploy: argo" components: Kubernetes manifests (or a Helm chart) delivered by Argo CD,
# whatever tool produced them (a Crossplane XR, the Argo CD Application of an instance, a chart). The actual
# deploy is GitOps once merged into main, and the Applications are synced by the argo-sync job of deploy.yaml
# (they track main). This module only checks that the component is valid, so a broken one blocks the merge
# into main.
on:
  workflow_call:
    inputs:
      resource:
        description: 'Component folder, e.g. resources/s3-bucket-x or resources/argo-apps/s3-bucket-x'
        required: true
        type: string
      ref:
        description: 'Commit to deploy'
        required: true
        type: string

jobs:
  validate:
    runs-on: self-hosted

    env:
      RESOURCE: ${{ inputs.resource }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Validate component
        run: |
          [[ "$RESOURCE" =~ ^resources(/[A-Za-z0-9._-]+)+$ && "$RESOURCE" != *..* ]] || { echo "::error::Invalid resource '$RESOURCE'"; exit 1; }
          meta="$RESOURCE/metadata.yaml"
          apps=$(yq '[.argo_application] | flatten | .[] | select(. != null)' "$meta")
          [ -n "$apps" ] || { echo "::error::$meta declares no argo_application"; exit 1; }
          if [ -f "$RESOURCE/Chart.yaml" ]; then
            yq -e '.apiVersion and .name' "$RESOURCE/Chart.yaml" > /dev/null || { echo "::error::$RESOURCE/Chart.yaml is not a valid Helm chart"; exit 1; }
            echo "OK $RESOURCE is a Helm chart"
          else
            found=0
            while IFS= read -r -d '' f; do
              found=1
              yq -o=json '.' "$f" | jq -se 'all(.[]; .apiVersion and .kind)' > /dev/null || {
                echo "::error::$f is not a valid Kubernetes manifest (apiVersion and kind are required)"
                exit 1
              }
              echo "OK $f"
            done < <(find "$RESOURCE" -type f \( -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) \
                       ! -name metadata.yaml ! -name catalog-info.yaml ! -name variables.json -print0)
            [ "$found" = 1 ] || { echo "::error::$RESOURCE contains no manifest"; exit 1; }
          fi
          echo "$RESOURCE is delivered by the Argo CD Application(s): $(echo $apps)"
