create: true
resourceId: s3-bucket-{{ parameters.name }}
scaffolding_plan: storage-{{ parameters.cloud_provider }}
plans:
  storage-azure:
    - template: github.com/tommyliverani/highway-to-cloud//templates/s3/create_bucket/terraform
      resource: github.com/tommyliverani/highway-to-cloud//resources/s3-bucket-{{ parameters.name }}
  storage-aws:
    - template: github.com/tommyliverani/highway-to-cloud//templates/argo/create_application/crossplane
      resource: github.com/tommyliverani/highway-to-cloud//resources/argo-apps/s3-bucket-{{ parameters.name }}
    - template: github.com/tommyliverani/highway-to-cloud//templates/s3/create_bucket/crossplane
      resource: github.com/tommyliverani/highway-to-cloud//resources/s3-bucket-{{ parameters.name }}