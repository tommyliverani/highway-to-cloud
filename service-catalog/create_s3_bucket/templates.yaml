resourceId: s3-bucket-{{ parameters.name }}
default_tool: terraform
terraform:
- template: github.com/tommyliverani/highway-to-cloud//templates/s3/create_bucket
  resource: github.com/tommyliverani/highway-to-cloud//resources/{{ parameters.name }}
crossplane:
- template: github.com/tommyliverani/highway-to-cloud//argo/create_application
  resource: github.com/tommyliverani/highway-to-cloud//argo/apps
- template: github.com/tommyliverani/highway-to-cloud//templates/s3/create_bucket
  resource: github.com/tommyliverani/highway-to-cloud//resources/{{ parameters.name }}
