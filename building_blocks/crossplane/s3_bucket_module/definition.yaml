# API of the building block: same inputs/outputs as building_blocks/terraform/s3_bucket_module.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: s3buckets.storage.highwaytocloud.io
spec:
  scope: Namespaced
  group: storage.highwaytocloud.io
  names:
    kind: S3Bucket
    plural: s3buckets
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - region
              properties:
                bucketName:
                  type: string
                  description: Name of the bucket. Defaults to the name of this resource.
                bucketNamespace:
                  type: string
                  enum: [global, account-regional]
                  default: global
                  description: global, or account-regional (the name must end with -<account-id>-<region>-an and is reserved to this account).
                region:
                  type: string
                  description: AWS region of the bucket.
                forceDestroy:
                  type: boolean
                  default: false
                  description: Delete all objects when the bucket is deleted. These objects are not recoverable.
                enableServerSideEncryption:
                  type: boolean
                  default: false
                  description: Enable server side encryption.
                kmsKey:
                  type: string
                  description: KMS key used when kmsSseAlg is aws:kms.
                kmsSseAlg:
                  type: string
                  enum: [AES256, "aws:kms"]
                  default: AES256
                  description: Server side encryption algorithm.
                objectLockEnabled:
                  type: boolean
                  default: false
                  description: Enable an Object Lock default retention on the bucket.
                objectLockRetentionType:
                  type: string
                  enum: [GOVERNANCE, COMPLIANCE]
                  default: GOVERNANCE
                  description: Object Lock retention mode.
                objectLockRetentionDays:
                  type: integer
                  minimum: 1
                  default: 365
                  description: Number of days for Object Lock retention.
                tags:
                  type: object
                  additionalProperties:
                    type: string
                  description: Tags to assign to the bucket.
                intelligentTieringEnabled:
                  type: boolean
                  default: false
                  description: Move objects stored in the INTELLIGENT_TIERING class to the archive tiers when not accessed.
                intelligentTieringArchiveDays:
                  type: integer
                  minimum: 90
                  maximum: 730
                  default: 90
                  description: Days without access before objects move to the Archive Access tier.
                intelligentTieringDeepArchiveDays:
                  type: integer
                  default: 0
                  description: Days without access before objects move to the Deep Archive Access tier (180-730, 0 = disabled).
                  x-kubernetes-validations:
                    - rule: self == 0 || (self >= 180 && self <= 730)
                      message: intelligentTieringDeepArchiveDays must be 0 or between 180 and 730.
                lifecycleRuleEnabled:
                  type: boolean
                  default: false
                  description: Apply a lifecycle rule to every object of the bucket.
                lifecycleTransitionDays:
                  type: integer
                  minimum: 0
                  default: 0
                  description: Days after creation before objects move to lifecycleTransitionStorageClass (0 = no transition).
                lifecycleTransitionStorageClass:
                  type: string
                  enum: [STANDARD_IA, INTELLIGENT_TIERING, GLACIER, DEEP_ARCHIVE]
                  default: STANDARD_IA
                  description: Storage class objects move to.
                lifecycleExpirationDays:
                  type: integer
                  minimum: 0
                  default: 0
                  description: Days after creation before objects are deleted (0 = never).
                lifecycleNoncurrentVersionExpirationDays:
                  type: integer
                  minimum: 0
                  default: 0
                  description: Days before non-current object versions are deleted (0 = never).
                lifecycleAbortMultipartDays:
                  type: integer
                  minimum: 0
                  default: 7
                  description: Days before incomplete multipart uploads are aborted (0 = never).
                providerConfigName:
                  type: string
                  default: default
                  description: ClusterProviderConfig with the AWS credentials to use.
              # Same checks as the preconditions of lifecycle.tf in the Terraform module.
              x-kubernetes-validations:
                - rule: "!self.lifecycleRuleEnabled || self.lifecycleTransitionDays == 0 || self.lifecycleTransitionStorageClass != 'STANDARD_IA' || self.lifecycleTransitionDays >= 30"
                  message: Objects can move to STANDARD_IA only after at least 30 days.
                - rule: "!self.lifecycleRuleEnabled || self.lifecycleExpirationDays == 0 || self.lifecycleTransitionDays == 0 || self.lifecycleExpirationDays > self.lifecycleTransitionDays"
                  message: lifecycleExpirationDays must be greater than lifecycleTransitionDays.
            status:
              type: object
              properties:
                bucketId:
                  type: string
                  description: The name of the bucket.
                bucketArn:
                  type: string
                  description: The ARN of the bucket.
                bucketDomainName:
                  type: string
                  description: The bucket domain name.
                bucketRegion:
                  type: string
                  description: The AWS region the bucket resides in.
