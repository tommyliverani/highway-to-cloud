---
- name: Look for the secret file
  ansible.builtin.stat:
    path: "{{ secret.path }}"
  register: _secret_file

- name: Check the secret file exists
  ansible.builtin.assert:
    that: _secret_file.stat.exists and _secret_file.stat.isreg
    fail_msg: "{{ secret.path }} does not exist on the machine that runs the deploy, or is not a file"
    quiet: true

- name: Ensure the namespace exists
  ansible.builtin.command: "{{ _kubectl }} create namespace {{ secret.namespace }}"
  register: _secret_namespace
  failed_when: _secret_namespace.rc != 0 and 'AlreadyExists' not in _secret_namespace.stderr
  changed_when: _secret_namespace.rc == 0

# The manifest is rendered by kubectl from the file, so the content stays out of the Ansible variables; the
# tasks that carry it do not log. Server-side apply: client-side would copy the content into the
# last-applied-configuration annotation.
- name: Render the secret
  ansible.builtin.command: >-
    {{ _kubectl }} create secret generic {{ secret.name | default(secret.path | basename) }}
    --namespace {{ secret.namespace }} --from-file={{ secret.path }} --dry-run=client --output yaml
  register: _secret_manifest
  changed_when: false
  no_log: true

- name: Apply the secret
  ansible.builtin.command: "{{ _kubectl }} apply --server-side --force-conflicts -f -"
  args:
    stdin: "{{ _secret_manifest.stdout }}"
  no_log: true
