apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: enable-storage-retention
  title: Enable storage retention
  description: Protects the data of an existing remote storage from changes and deletion for a period of time
  idpServiceId: enable_storage_retention

spec:
  owner: team-platform
  type: infrastructure

  parameters:
    - title: Retention configuration
      description: Select the storage and the retention period
      required:
        - resource
        - retention_days
      properties:

        resource:
          title: Storage
          type: string
          description: Existing remote storage to enable retention on
          ui:field: EntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Resource
                spec.type: storage

        retention_days:
          title: Retention days
          type: integer
          description: Number of days during which stored data cannot be modified or deleted
          default: 365
          minimum: 1

  steps:

    - id: run-template-workflow
      name: Run template workflow
      action: github:actions:dispatch

      input:
        repoUrl: github.com?owner=tommyliverani&repo=highway-to-cloud
        workflowId: template.yaml
        branchOrTagName: develop

        workflowInputs:

          service_id: enable_storage_retention
          parameters: >-
            {"name": ${{ parameters.resource | parseEntityRef | pick('name') | dump }},
            "retention_days": ${{ parameters.retention_days }}}

    - id: log-workflow-link
      name: Print GitHub Actions link

      action: debug:log

      input:
        message: >-
          GitHub Actions workflow triggered:
          https://github.com/tommyliverani/highway-to-cloud/actions/workflows/template.yaml
