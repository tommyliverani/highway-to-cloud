apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: enable-storage-retention
  title: Enable storage retention
  description: Enables Object Lock retention on an existing S3 bucket
  idpServiceId: enable_storage_retention

spec:
  owner: team-platform
  type: infrastructure

  parameters:
    - title: Retention configuration
      description: Select the bucket and the retention period
      required:
        - resource
        - retention_days
      properties:

        resource:
          title: Bucket
          type: string
          description: Existing S3 bucket to enable retention on
          ui:field: EntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Resource
                spec.type: storage

        retention_days:
          title: Retention days
          type: integer
          description: Number of days objects are locked
          default: 365
          minimum: 1

  steps:

    - id: run-template-workflow
      name: Run template workflow
      action: github:actions:dispatch

      input:
        repoUrl: github.com?owner=tommyliverani&repo=highway-to-cloud
        workflowId: template.yaml
        branchOrTagName: main

        workflowInputs:

          operation_id: enable_storage_retention
          resource_id: ${{ parameters.resource | parseEntityRef | pick('name') }}

          backstage_params: >-
            {
              "name": "${{ parameters.resource | parseEntityRef | pick('name') }}",
              "retention_days": ${{ parameters.retention_days }}
            }

    - id: log-workflow-link
      name: Print GitHub Actions link

      action: debug:log

      input:
        message: >-
          GitHub Actions workflow triggered:
          https://github.com/tommyliverani/highway-to-cloud/actions/workflows/template.yaml
