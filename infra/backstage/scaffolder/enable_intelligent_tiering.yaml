apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: enable-storage-intelligent-tiering
  title: Enable storage intelligent tiering
  description: Automatically moves the data of an existing remote storage that is not accessed for a long time to cheaper archive storage
  idpServiceId: enable_intelligent_tiering

spec:
  owner: team-platform
  type: infrastructure

  parameters:
    - title: Intelligent tiering configuration
      description: Select the storage and how far data can be archived
      required:
        - resource
        - archive_days
      properties:

        resource:
          title: Storage
          type: string
          description: Existing remote storage to enable intelligent tiering on
          ui:field: EntityPicker
          ui:options:
            allowArbitraryValues: false
            catalogFilter:
              - kind: Resource
                spec.type: storage

        archive_days:
          title: Archive after (days)
          type: integer
          minimum: 90
          maximum: 730
          default: 90
          description: Days without access before data moves to the archive (90-730)

        deep_archive:
          title: Deep archive
          type: boolean
          default: false
          description: Also move data not accessed for a very long time to the cheapest archive, which is the slowest to restore

      # The deep archive days field appears only when deep archive is enabled.
      dependencies:
        deep_archive:
          oneOf:
            - properties:
                deep_archive:
                  const: false
            - properties:
                deep_archive:
                  const: true
                deep_archive_days:
                  title: Deep archive after (days)
                  type: integer
                  minimum: 180
                  maximum: 730
                  default: 180
                  description: Days without access before data moves to the deep archive (180-730)
              required:
                - deep_archive_days

  steps:

    - id: run-template-workflow
      name: Run template workflow
      action: github:actions:dispatch

      input:
        repoUrl: github.com?owner=tommyliverani&repo=highway-to-cloud
        workflowId: template.yaml
        branchOrTagName: develop

        workflowInputs:
          service_id: enable_intelligent_tiering
          parameters: >-
            {"name": ${{ parameters.resource | parseEntityRef | pick('name') | dump }},
            "archive_days": ${{ parameters.archive_days }},
            "deep_archive_days": ${{ parameters.deep_archive_days if parameters.deep_archive else 0 }}}

    - id: log-workflow-link
      name: Print GitHub Actions link

      action: debug:log

      input:
        message: >-
          GitHub Actions workflow triggered:
          https://github.com/tommyliverani/highway-to-cloud/actions/workflows/template.yaml
