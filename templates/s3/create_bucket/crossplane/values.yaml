# Defaults of the resource (the equivalent of variables.tf in the Terraform template).
# The actual values come from variables.json, passed to Helm as a values file.
bucket_name: ""
region: us-east-1
force_destroy: false
enable_server_side_encryption: false
kms_key: ""
kms_sse_alg: AES256
object_lock_enabled: false
object_lock_retention_type: GOVERNANCE
object_lock_retention_days: 365
intelligent_tiering_enabled: false
intelligent_tiering_archive_days: 90
intelligent_tiering_deep_archive_days: 0
lifecycle_rule_enabled: false
lifecycle_transition_days: 0
lifecycle_transition_storage_class: STANDARD_IA
lifecycle_expiration_days: 0
lifecycle_noncurrent_version_expiration_days: 0
lifecycle_abort_multipart_days: 7
tags: {}
