{{- /* Calls the S3Bucket building block (building_blocks/crossplane/s3_bucket_module), the equivalent of main.tf */ -}}
{{- $v := .Values }}
apiVersion: storage.highwaytocloud.io/v1alpha1
kind: S3Bucket
metadata:
  name: {{ required "bucket_name is required" $v.bucket_name }}
spec:
  crossplane:
    compositionRef:
      name: s3buckets-aws
  bucketName: {{ $v.bucket_name | quote }}
  region: {{ $v.region | quote }}
  forceDestroy: {{ $v.force_destroy }}
  enableServerSideEncryption: {{ $v.enable_server_side_encryption }}
  {{- with $v.kms_key }}
  kmsKey: {{ . | quote }}
  {{- end }}
  kmsSseAlg: {{ $v.kms_sse_alg | quote }}
  objectLockEnabled: {{ $v.object_lock_enabled }}
  objectLockRetentionType: {{ $v.object_lock_retention_type | quote }}
  objectLockRetentionDays: {{ $v.object_lock_retention_days | int }}
  intelligentTieringEnabled: {{ $v.intelligent_tiering_enabled }}
  intelligentTieringArchiveDays: {{ $v.intelligent_tiering_archive_days | int }}
  intelligentTieringDeepArchiveDays: {{ $v.intelligent_tiering_deep_archive_days | int }}
  lifecycleRuleEnabled: {{ $v.lifecycle_rule_enabled }}
  lifecycleTransitionDays: {{ $v.lifecycle_transition_days | int }}
  lifecycleTransitionStorageClass: {{ $v.lifecycle_transition_storage_class | quote }}
  lifecycleExpirationDays: {{ $v.lifecycle_expiration_days | int }}
  lifecycleNoncurrentVersionExpirationDays: {{ $v.lifecycle_noncurrent_version_expiration_days | int }}
  lifecycleAbortMultipartDays: {{ $v.lifecycle_abort_multipart_days | int }}
  {{- with $v.tags }}
  tags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
