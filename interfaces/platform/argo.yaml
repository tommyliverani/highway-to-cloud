# How the platform uses Argo CD: how it delivers resources, and how it is installed in the clusters it creates

# Delivery of resources (the Argo CD Applications of the components)
repo_url: https://github.com/tommyliverani/highway-to-cloud.git
root_application: argo-app          # app-of-apps, syncs root_application_path
root_application_path: resources/argo-apps
target_revision: main
project: default
destination_namespace: platform-resources   # where the delivered resources land

# Installation in the clusters created by the platform (Helm umbrella chart)
install_namespace: argocd           # where Argo CD runs and where its Applications live
release: argocd
helm_repo_url: https://argoproj.github.io/argo-helm
chart: argo-cd
chart_version: "10.9.6"

# The UI is exposed on the host (k3s servicelb) as the port-forward of infra/k8s/setup.sh did:
# https://localhost:8080, self-signed certificate. Not 80/443: the Traefik of k3s takes them.
ui_port: 8080
ui_http_port: 8081                  # the chart's service always has an http port too
